name: lint / deps

on:
  pull_request:
    paths:
      - .github/workflows/lint--deps.yaml
      - 'crates/**/*.rs'
      - '**/Cargo.lock'
      - '**/Cargo.toml'

jobs:
  machete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3
        with:
          crate: cargo-machete
          # renovate: datasource=crate depName=cargo-machete
          version: "0.9.2"
      - run: cargo machete --with-metadata --fix
        continue-on-error: true
      - id: generate-token
        uses: oakcask/gh-token-gen@4bd7b29d36a07b1de07b49c9fdbfe16c03d00bc2 # v5.1.0
        with:
          app-id: ${{ secrets.TOKEN_GEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_GEN_PRIVATE_KEY }}
      - uses: int128/update-generated-files-action@943b8967da5d16e73f082cc3ae2cb78cd9d933af # v2
        with:
          commit-message: "chore: cleanup lockfiles"
          token: ${{ steps.generate-token.outputs.token }}
